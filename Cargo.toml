[package]
name = "burn-kda"
version = "0.4.1"
edition = "2021"
license = "AGPL-3.0"
description = "Kimi Delta Attention for Burn - data-dependent write strength, channel-wise decay (Kimi Linear + K3), fused CUDA chunk path"
keywords = ["burn", "kda", "delta", "attention", "recurrent"]
repository = "https://github.com/sehaxe/burn-kda"
homepage = "https://github.com/sehaxe/burn-kda"
readme = "README.md"

[features]
default = ["std"]
std = ["burn/std", "burn-tensor/std", "burn-gdn2/std"]
autodiff = ["burn/autodiff", "burn-gdn2/autodiff", "dep:burn-autodiff"]
cuda = ["dep:burn-cuda", "dep:burn-cubecl", "dep:cubecl", "burn/cuda", "burn-tensor/cuda", "burn-gdn2/cuda"]

[dependencies]
burn = { version = "0.22.0-pre.1", default-features = false }
burn-tensor = { version = "0.22.0-pre.1", default-features = false }
burn-gdn2 = { version = "0.7", default-features = false }
burn-autodiff = { version = "0.22.0-pre.1", default-features = false, features = ["std"], optional = true }
burn-cuda = { version = "0.22.0-pre.1", optional = true, default-features = false }
burn-cubecl = { version = "0.22.0-pre.1", optional = true, default-features = false }
cubecl = { version = "0.11.0-pre.1", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
burn-ndarray = { version = "0.22.0-pre.1", features = ["blas-openblas"] }
burn = { version = "0.22.0-pre.1", default-features = false, features = ["ndarray", "autodiff", "cuda", "extension"] }
